<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Resources Unavailable</title>
    <style>
      :root {
        --bg: #14080a;
        --panel: rgba(31, 12, 14, 0.9);
        --accent: #ff6b6b;
        --text: #ffe5e5;
        --muted: #e7a0a0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Courier New", Courier, monospace;
        color: var(--text);
        background: radial-gradient(circle at 30% 20%, rgba(255, 107, 107, 0.15), transparent 50%), var(--bg);
      }

      .panel {
        width: min(640px, 100%);
        border: 1px solid var(--accent);
        border-radius: 12px;
        background: var(--panel);
        padding: 24px;
        box-shadow: 0 0 26px rgba(255, 107, 107, 0.18);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.4rem, 4vw, 2rem);
      }

      p {
        margin: 0 0 10px;
        color: var(--muted);
        line-height: 1.45;
      }

      a {
        display: inline-block;
        margin-top: 10px;
        color: var(--text);
        text-decoration: none;
        border: 1px solid var(--accent);
        border-radius: 8px;
        padding: 10px 12px;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>SERVER RESOURCES UNAVAILABLE</h1>
      <p>Unable to fetch password hint resources at this time.</p>
      <p>Reason: remote archive index is in a restricted maintenance cycle.</p>
      <p>Error code: HPU-RESOURCE-503</p>
      <a href="/hackpretend/escalate">Return to Escalation Gateway</a>
    </main>
  </body>
</html>
